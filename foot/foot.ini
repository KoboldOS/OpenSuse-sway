# foot — openSUSE theme
[main]
term=xterm-256color
font=Source Code Pro:size=11, monospace:size=11
pad=10x10 center
dpi-aware=no

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=yes

[colors]
alpha=0.95
foreground=e8f1f2
background=0d2530

## Normal
regular0=173f4f   # black   (pine)
regular1=e05a5a   # red
regular2=73ba25   # green   (openSUSE green)
regular3=f0c24b   # yellow
regular4=21a4df   # blue    (openSUSE blue)
regular5=b07cd8   # magenta
regular6=35b9ab   # cyan    (openSUSE cyan)
regular7=c9d8dc   # white

## Bright
bright0=4a7383
bright1=f07c7c
bright2=8fd14f
bright3=f7d77a
bright4=5cbfec
bright5=c9a0e6
bright6=5fd1c4
bright7=ffffff

selection-foreground=0d2530
selection-background=73ba25
urls=21a4df
